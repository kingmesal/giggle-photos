name: Build & Release

# Installable packages for every platform. Electrobun 2.x (Hutch) builds for the host only and
# ignores --targets, so each target runs on its own native runner. Builds are unsigned for now:
# macOS needs right-click → Open (or `xattr -dr com.apple.quarantine`), Windows shows SmartScreen.
#
# Push a tag `v*` to publish a draft GitHub Release; run it by hand to just get the artifacts.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      channel:
        description: "Release channel"
        required: true
        default: "stable"
        type: choice
        options: [stable, canary]

permissions:
  contents: write

env:
  BUN_VERSION: "1.4.3"
  CHANNEL: ${{ github.event.inputs.channel || 'stable' }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: linux-x64, runner: ubuntu-24.04 }
          - { target: linux-arm64, runner: ubuntu-24.04-arm }
          - { target: win-x64, runner: windows-latest }
          - { target: macos-arm64, runner: macos-latest }
          # No macos-x64: onnxruntime-node (1.31) ships no Intel macOS binary, so CLIP cannot load.
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Linux system packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-0 libayatana-appindicator3-1 libgtk-3-0 zstd

      - name: Cache Hutch toolchain
        uses: actions/cache@v4
        with:
          path: ~/.hutch
          key: hutch-${{ matrix.target }}-${{ hashFiles('hutch.config.ts', 'bun.lock') }}

      - run: bun install --frozen-lockfile

      # postBuild (apps/desktop/scripts/postbuild.ts) copies sharp + onnxruntime-node into the app
      # and fails the build if they do not load.
      - name: Build ${{ matrix.target }}
        run: bun run --cwd apps/desktop build:${{ env.CHANNEL }}

      - name: Check the native modules are inside the package
        run: bun apps/desktop/scripts/check-package.ts

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: apps/desktop/artifacts/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: ls -l dist
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Giggle Photos ${{ github.ref_name }}
          draft: true
          generate_release_notes: true
          files: dist/*
