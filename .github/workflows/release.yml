name: Build & Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      channel:
        description: "Release channel"
        required: true
        default: "canary"
        type: choice
        options:
          - canary
          - stable

permissions:
  contents: write

env:
  BUN_VERSION: "1.3.9"
  CHANNEL: ${{ github.event.inputs.channel || 'stable' }}

jobs:
  # Electrobun 2.x (Hutch) builds for the host only and silently ignores
  # --targets, so every target needs its own native runner.
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: linux-x64, runner: ubuntu-latest }
          - { target: linux-arm64, runner: ubuntu-24.04-arm }
          - { target: win-x64, runner: windows-latest }
          - { target: macos-arm64, runner: macos-latest }
          - { target: macos-x64, runner: macos-15-intel }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache Hutch toolchain store
        uses: actions/cache@v4
        with:
          path: ~/.hutch/releases
          key: hutch-${{ matrix.target }}-${{ hashFiles('hutch.config.ts') }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build for ${{ matrix.target }}
        run: bun run --cwd apps/desktop build:${{ env.CHANNEL }}

      - name: Upload ${{ matrix.target }} artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}-artifacts
          path: apps/desktop/artifacts/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -lR release-artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          draft: true
          generate_release_notes: true
          files: release-artifacts/*
