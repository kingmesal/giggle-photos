<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Giggle Photos</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            fg: {
              DEFAULT: 'var(--fg)',
              2: 'var(--fg-2)',
              3: 'var(--fg-3)',
              muted: 'var(--fg-muted)',
              faint: 'var(--fg-faint)',
            },
            surface: {
              DEFAULT: 'var(--surface)',
              card: 'var(--surface-card)',
              inset: 'var(--surface-inset)',
              hover: 'var(--surface-hover)',
              active: 'var(--surface-active)',
            },
            edge: {
              DEFAULT: 'var(--edge)',
            },
            accent: {
              green: 'var(--accent-green)',
              blue: 'var(--accent-blue)',
              amber: 'var(--accent-amber)',
              red: 'var(--accent-red)',
            },
          }
        }
      }
    }
  </script>
  <!-- App styles -->
  <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-surface text-fg">
  <div id="app"></div>
  <!-- In development, this will be bundled by Electrobun -->
  <!-- In production, Electrobun will bundle this as mainview.js -->
  <script type="module" src="./mainview.js"></script>
</body>
</html>
